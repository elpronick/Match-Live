            background: radial-gradient(circle at center, #f4efe8 0%, #faeae9 100%);

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(49, 30, 19, 0.12);
        }

    body {

<body class="p-md md:p-xxl">
<!-- Login Container -->
<main class="w-full max-w-[480px] mx-auto">
<div class="glass-card bg-surface-translucent rounded-lg p-xl md:p-xxl flex flex-col items-center">
<!-- Brand Logo Area -->
<div class="flex items-center gap-sm mb-xxl">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="diversity_3">diversity_3</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Match-Live</h1>
</div>
<!-- Welcome Text -->
<div class="w-full mb-xl text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Bienvenido de nuevo</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Encuentra a tu compañero ideal hoy mismo</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-lg">
<!-- Email Input -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block px-sm" for="email">Correo electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant/60" data-icon="mail">mail</span>
<input class="w-full bg-surface-solid border-border-subtle rounded-[18px] py-md pl-[48px] pr-md font-body-md text-body-md focus:ring-primary focus:border-primary transition-all placeholder:text-on-surface-variant/40" id="email" placeholder="nombre@ejemplo.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-sm">
<div class="flex justify-between items-center px-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Contraseña</label>
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant/60" data-icon="lock">lock</span>
<input class="w-full bg-surface-solid border-border-subtle rounded-[18px] py-md pl-[48px] pr-md font-body-md text-body-md focus:ring-primary focus:border-primary transition-all placeholder:text-on-surface-variant/40" id="password" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant/60 cursor-pointer" data-icon="visibility">visibility</span>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm px-sm pt-xs">
<input class="w-5 h-5 rounded-[6px] border-border-subtle text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none" for="remember">Recordar sesión</label>
</div>
<!-- CTA Button -->
<div class="pt-md">
<button class="w-full bg-primary text-on-primary font-headline-md text-[18px] py-md rounded-full shadow-lg shadow-primary/20 hover:bg-accent-pink-dark active:scale-[0.98] transition-all" type="submit">
                        Iniciar sesión
                    </button>
</div>
</form>
<!-- Social Login Divider -->
<div class="w-full flex items-center gap-md my-xl">
<div class="h-[1px] flex-1 bg-border-subtle"></div>
<span class="font-label-md text-label-md text-on-surface-variant/60">O CONTINUAR CON</span>
<div class="h-[1px] flex-1 bg-border-subtle"></div>
</div>
<!-- Social Buttons -->
<div class="w-full flex gap-md mb-xl">
<button class="flex-1 flex items-center justify-center gap-sm bg-surface-solid border border-border-subtle py-md rounded-[18px] font-body-md text-on-surface hover:bg-surface-container-low transition-colors">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-RqVw2jlrg0aBZzTv93tNpCVNakjMc3gKM0M1eqKXHnR_HfA82YSTHYEsGK_XOVQZ90f16V1ZnGBAImQ7IXf3VBBV0tOdbYeUsDbdenzyG7jgRuSWSxfhPwFfowvnz5xTkfqtKRq7TgGgAvKTcr2t02v05GnhjQd9yM_NuFVIaACt5ARst2ph9nL2ifdUXskRXohQoqFFzca5c4I5070DlDQBmKjvTsV_ZhXq2iOOjTVmWPFHj_b_9UNZeIcyLZACH43sPqJGXPo"/>
                    Google
                </button>
<button class="flex-1 flex items-center justify-center gap-sm bg-surface-solid border border-border-subtle py-md rounded-[18px] font-body-md text-on-surface hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[#1877F2]" data-icon="facebook" style="font-variation-settings: 'FILL' 1;">Notebook</span>
                    Facebook
                </button>
</div>
<!-- Register Link -->
<p class="font-body-md text-body-md text-on-surface-variant">
                ¿No tienes cuenta? 
                <a class="text-primary font-bold hover:underline" href="#">Regístrate</a>
</p>
</div>
<!-- Decorative Elements -->
<div class="mt-xl text-center">
<p class="font-label-md text-label-md text-on-surface-variant/40 max-w-[300px] mx-auto">
                Al iniciar sesión, aceptas nuestros Términos de Servicio y Política de Privacidad.
            </p>
</div>
</main>
<!-- Background Decorative Visual -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary-container/30 rounded-full blur-[120px]"></div>
</div>
